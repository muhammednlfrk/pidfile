name: Publish

# Runs when you push a version tag such as v0.1.0 (MinVer derives the package version from the tag).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: create a "release" environment in repo settings to require manual approval before publishing.
    environment: release
    permissions:
      contents: read
      id-token: write # required for the OIDC exchange with nuget.org
      packages: write # required for publishing to GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs tags and history

      # Only publish tags that point to a commit on main.
      - name: Ensure tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/PidFile.NET -c Release --no-build -o artifacts

      # Exchanges the GitHub OIDC token for a short-lived NuGet API key (no long-lived secret).
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The matching .snupkg symbol package next to the .nupkg is pushed along with it.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
